name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # Integration tests need a throwaway Neon branch per run (doc 10). Add a step that creates one
      # (neondatabase/create-branch-action), exports TEST_DATABASE_URL, runs `npm run test:integration`,
      # and deletes the branch, once the Neon project exists.
